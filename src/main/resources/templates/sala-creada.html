<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala Creada</title>
    <link rel="stylesheet" th:href="@{/css/sala-creada.css}">
</head>
<body>
<div class="container">
    <h2>¡La sala ha sido creada exitosamente!</h2>
    <p>ID de la sala</p>
    <div class="info-box">
        <span id="displayRoomId">Cargando...</span>
        <span class="copy-icon" onclick="copyToClipboard('displayRoomId')">📋</span>
    </div>
    <p>Master Key de recuperación</p>
    <div class="info-box">
        <span id="displayMasterKey">Cargando...</span>
        <span class="copy-icon" onclick="copyToClipboard('displayMasterKey')">📋</span>
    </div>
    <p class="warning">Importante: No compartas tu Master Key. Anótala para recuperar el control administrativo en caso de ser necesario.</p>

    <button onclick="irALaSala()" class="btn btn-success">Ir directamente a la Sala ➔</button>
</div>

<script>
    const roomId = sessionStorage.getItem('lastCreatedRoomId');
    const masterKey = sessionStorage.getItem('lastCreatedMasterKey');

    if(roomId && masterKey) {
        document.getElementById('displayRoomId').innerText = roomId;
        document.getElementById('displayMasterKey').innerText = masterKey;
    }

    function irALaSala() { window.location.href = `/room/${roomId}`; }

    function copyToClipboard(elementId) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => { alert("Copiado al portapapeles"); });
    }
</script>
</body>
</html>
