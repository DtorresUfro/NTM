<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Sala</title>
    <style>
        body { background-color: #eaf3fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { text-align: center; width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; }
        h2 { color: #2b455e; margin-bottom: 30px; font-size: 24px;}
        .form-group { margin-bottom: 25px; text-align: left; }
        label { display: block; color: #555; font-size: 13px; margin-bottom: 8px; text-align: center;}
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; text-align: center; }
        input:focus { outline: none; border-color: #559ef6; }
        .btn { width: 100%; background-color: #559ef6; color: white; padding: 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 10px; }
        /* Modal de Validación */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 30px; border-radius: 8px; text-align: center; max-width: 300px; width: 90%; }
        .modal-box h3 { color: #e74c3c; margin-top: 0; }
        .btn-error { background-color: #e74c3c; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Crear nueva sala</h2>
    <form id="createRoomForm">
        <div class="form-group">
            <label>Ingresa nombre de la sala</label>
            <input type="text" id="roomName" required>
        </div>
        <div class="form-group">
            <label>Ingresa tu nombre</label>
            <input type="text" id="adminName" required>
        </div>
        <button type="submit" class="btn">Confirmar</button>
    </form>
</div>

<div id="validationModal" class="modal-overlay">
    <div class="modal-box">
        <h3>Error de Validación</h3>
        <p id="validationMsg">Verifique los datos ingresados.</p>
        <button onclick="closeModal()" class="btn btn-error">Intentar de nuevo</button>
    </div>
</div>

<script>
    function showModal(msg) {
        document.getElementById('validationMsg').innerText = msg;
        document.getElementById('validationModal').style.display = 'flex';
    }
    function closeModal() {
        document.getElementById('validationModal').style.display = 'none';
    }

    document.getElementById('createRoomForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const roomName = document.getElementById('roomName').value;
        const adminName = document.getElementById('adminName').value;

        try {
            const response = await fetch('/api/rooms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomName, adminName })
            });

            if (response.ok) {
                const data = await response.json();
                sessionStorage.setItem('lastCreatedRoomId', data.roomId);
                sessionStorage.setItem('lastCreatedMasterKey', data.masterKey);
                sessionStorage.setItem('currentUser', adminName);
                sessionStorage.setItem('isAdmin', 'true'); 
                window.location.href = '/sala-creada';
            } else {
                const err = await response.text();
                showModal(err || "No se pudo crear la sala. Intente con otro nombre.");
            }
        } catch (error) {
            showModal("Error de conexión con el servidor.");
        }
    });
</script>
</body>
</html>
