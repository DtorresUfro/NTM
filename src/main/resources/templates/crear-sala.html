<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Sala</title>
    <link rel="stylesheet" th:href="@{/css/crear-sala.css}">
</head>
<body>
<div class="container">
    <h2>Crear nueva sala</h2>
    <form id="createRoomForm">
        <div class="form-group">
            <label>Ingresa nombre de la sala</label>
            <input type="text" id="roomName" required>
        </div>
        <div class="form-group">
            <label>Ingresa tu nombre</label>
            <input type="text" id="adminName" required>
        </div>
        <button type="submit" class="btn">Confirmar</button>
    </form>
</div>

<div id="validationModal" class="modal-overlay">
    <div class="modal-box">
        <h3>Error de Validación</h3>
        <p id="validationMsg">Verifique los datos ingresados.</p>
        <button onclick="closeModal()" class="btn btn-error">Intentar de nuevo</button>
    </div>
</div>

<script>
    function showModal(msg) {
        document.getElementById('validationMsg').innerText = msg;
        document.getElementById('validationModal').style.display = 'flex';
    }
    function closeModal() {
        document.getElementById('validationModal').style.display = 'none';
    }

    document.getElementById('createRoomForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const roomName = document.getElementById('roomName').value;
        const adminName = document.getElementById('adminName').value;

        try {
            const response = await fetch('/api/rooms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomName, adminName })
            });

            if (response.ok) {
                const data = await response.json();
                sessionStorage.setItem('lastCreatedRoomId', data.roomId);
                sessionStorage.setItem('lastCreatedMasterKey', data.masterKey);
                sessionStorage.setItem('currentUser', adminName);
                sessionStorage.setItem('isAdmin', 'true'); 
                window.location.href = '/sala-creada';
            } else {
                const err = await response.text();
                showModal(err || "No se pudo crear la sala. Intente con otro nombre.");
            }
        } catch (error) {
            showModal("Error de conexión con el servidor.");
        }
    });
</script>
</body>
</html>
