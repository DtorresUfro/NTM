<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteTask Manager</title>
    <style>
        body {
            background-color: #eaf3fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }
        h2 {
            color: #2b455e;
            margin-bottom: 40px;
            font-size: 24px;
        }
        .btn {
            display: block;
            width: 100%;
            margin: 15px auto;
            padding: 14px;
            background-color: #559ef6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn:hover { background-color: #448cf0; }
    </style>
</head>
<body>
<div class="container">
    <h2>Bienvenido a NoteTask Manager</h2>
    <a href="/crear-sala" class="btn">Crear sala</a>
    <a href="/unirse-a-sala" class="btn">Unirse a sala</a>
</div>
</body>
</html>
