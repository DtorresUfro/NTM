<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrador</title>
  <style>
    body { background-color: #eaf3fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .container { text-align: center; width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; }
    h2 { color: #2b455e; margin-bottom: 10px; font-size: 24px;}
    p.subtitle { color: #555; font-size: 13px; margin-bottom: 30px; }

    .form-group { margin-bottom: 25px; text-align: left; }
    label { display: block; color: #555; font-size: 13px; margin-bottom: 8px; text-align: center; font-weight: bold;}
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; text-align: center; }
    input:focus { outline: none; border-color: #2b455e; }

    .btn { width: 100%; background-color: #2b455e; color: white; padding: 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 10px; }
    .link-back { color: #559ef6; text-decoration: none; font-size: 14px; display: inline-block; margin-top: 25px; font-weight: bold; }

    /* Modal de Error con el mismo diseño */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-box { background: white; padding: 30px; border-radius: 8px; text-align: center; max-width: 300px; width: 90%; }
    .modal-box h3 { color: #e74c3c; margin-top: 0; }
    .btn-error { width: 100%; background-color: #e74c3c; color: white; padding: 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 15px; }
  </style>
</head>
<body>
<div class="container">
  <h2>Acceso Administrativo</h2>
  <p class="subtitle">Introduce la Master Key de la sala para obtener privilegios de Administrador de forma automática.</p>

  <form id="adminAccessForm">
    <div class="form-group">
      <label>Master Key (Llave Maestra)</label>
      <input type="password" id="masterKey" required>
    </div>
    <button type="submit" class="btn">Verificar y Entrar</button>
  </form>

  <a href="/join-options" class="link-back">← Cambiar método de unión</a>
</div>

<div id="validationModal" class="modal-overlay">
  <div class="modal-box">
    <h3>Acceso Denegado</h3>
    <p id="validationMsg">La Master Key ingresada es incorrecta o la sala no existe.</p>
    <button onclick="closeModal()" class="btn-error">Reintentar</button>
  </div>
</div>

<script>
  function showModal(msg) {
    document.getElementById('validationMsg').innerText = msg;
    document.getElementById('validationModal').style.display = 'flex';
  }
  function closeModal() { document.getElementById('validationModal').style.display = 'none'; }

  document.getElementById('adminAccessForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const masterKey = document.getElementById('masterKey').value;

    try {
      const response = await fetch('/api/rooms/validate-masterkey', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ masterKey: masterKey })
      });

      if (response.ok) {
        const data = await response.json();
        sessionStorage.setItem('isAdmin', 'true'); // Guardamos que es admin en la sesión
        window.location.href = `/room/${data.roomId}/admin`;
      } else {
        showModal("Master Key incorrecta o inexistente. Por favor, verifica los datos.");
      }
    } catch (error) {
      showModal("Error de conexión con el servidor.");
    }
  });
</script>
</body>
</html>
