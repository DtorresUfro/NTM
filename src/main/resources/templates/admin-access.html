<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrador</title>
    <link rel="stylesheet" th:href="@{/css/admin-access.css}">
</head>
<body>
<div class="container">
  <h2>Acceso Administrativo</h2>
  <p class="subtitle">Introduce la Master Key de la sala para obtener privilegios de Administrador de forma automática.</p>

  <form id="adminAccessForm">
    <div class="form-group">
      <label>Master Key (Llave Maestra)</label>
      <input type="password" id="masterKey" required>
    </div>
    <button type="submit" class="btn">Verificar y Entrar</button>
  </form>

  <a href="/join-options" class="link-back">← Cambiar método de unión</a>
</div>

<div id="validationModal" class="modal-overlay">
  <div class="modal-box">
    <h3>Acceso Denegado</h3>
    <p id="validationMsg">La Master Key ingresada es incorrecta o la sala no existe.</p>
    <button onclick="closeModal()" class="btn-error">Reintentar</button>
  </div>
</div>

<script>
  function showModal(msg) {
    document.getElementById('validationMsg').innerText = msg;
    document.getElementById('validationModal').style.display = 'flex';
  }
  function closeModal() { document.getElementById('validationModal').style.display = 'none'; }

  document.getElementById('adminAccessForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const masterKey = document.getElementById('masterKey').value;

    try {
      const response = await fetch('/api/rooms/validate-masterkey', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ masterKey: masterKey })
      });

      if (response.ok) {
        const data = await response.json();

        // 1. Se reinicia la sesión dándole los privilegios
        sessionStorage.setItem('isAdmin', 'true');

        sessionStorage.setItem('currentUser', data.adminName ? data.adminName : 'Administrador');

        window.location.href = `/room/${data.roomId}`;

      } else {
        showModal("Master Key incorrecta o inexistente. Por favor, verifica los datos.");
      }
    } catch (error) {
      showModal("Error de conexión con el servidor.");
    }
  });
</script>
</body>
</html>
