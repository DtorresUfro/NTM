<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opciones de Acceso</title>
    <style>
        body { background-color: #eaf3fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { text-align: center; width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; }
        h2 { color: #2b455e; margin-bottom: 10px; font-size: 24px;}
        p.subtitle { color: #555; font-size: 14px; margin-bottom: 30px; }

        .btn { display: block; width: 100%; background-color: #559ef6; color: white; padding: 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 15px; text-decoration: none; box-sizing: border-box; }
        .btn-dark { background-color: #2b455e; }
        .btn span { display: block; font-size: 12px; font-weight: normal; margin-top: 5px; opacity: 0.9; }

        .link-back { color: #559ef6; text-decoration: none; font-size: 14px; display: inline-block; margin-top: 25px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h2>¿Cómo deseas ingresar?</h2>
    <p class="subtitle">Selecciona el método de autenticación correspondiente a tu rol.</p>

    <a href="/unirse-sala" class="btn">
         Unirse mediante ID de Sala
    </a>

    <a href="/admin-access" class="btn btn-dark">
         Acceso mediante Master Key
    </a>

    <a href="/" class="link-back">← Volver al inicio</a>
</div>
</body>
</html>
