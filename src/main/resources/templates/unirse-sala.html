<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unirse a Sala</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/pages.css}">
</head>
<body class="page-join-room">
<div class="container">
    <h2>Unirse a una sala</h2>
    <form id="joinRoomForm">
        <div class="form-group">
            <label>Ingresa el ID de la sala</label>
            <input type="text" id="roomId" required>
        </div>
        <div class="form-group">
            <label>Ingresa tu nombre</label>
            <input type="text" id="username" required>
        </div>
        <button type="submit" class="btn">Unirse a la Sala</button>
    </form>
</div>

<div id="validationModal" class="modal-overlay">
    <div class="modal-box">
        <h3>Sala no encontrada</h3>
        <p id="validationMsg">El ID ingresado es incorrecto o la sala ya no existe.</p>
        <button onclick="closeModal()" class="btn btn-error">Reintentar</button>
    </div>
</div>

<script>
    function showModal(msg) {
        document.getElementById('validationMsg').innerText = msg;
        document.getElementById('validationModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('validationModal').style.display = 'none'; }

    document.getElementById('joinRoomForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const roomId = document.getElementById('roomId').value;
        const username = document.getElementById('username').value;

        try {
            const response = await fetch('/api/rooms/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomId, username })
            });

            if (response.ok) {
                sessionStorage.setItem('currentUser', username);
                sessionStorage.setItem('isAdmin', 'false'); // Al unirse no eres admin inicialmente
                window.location.href = `/room/${roomId}`;
            } else {
                showModal("El ID de la sala es inválido o el nombre de usuario ya está en uso.");
            }
        } catch (error) {
            showModal("Error de conexión con el servidor.");
        }
    });
</script>
</body>
</html>
