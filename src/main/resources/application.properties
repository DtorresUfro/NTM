spring.application.name=Ntm

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}

google.client.client-id=${GOOGLE_CLIENT_ID:}
google.client.client-secret=${GOOGLE_CLIENT_SECRET:}
google.client.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/callback}
